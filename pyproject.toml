[project]
name = "3sd"
version = "0.2.0"
description = "Prototype launcher that maps physical SSD cartridges to Steam games."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography==50.0.1",
  "Pillow==11.3.0",
  "pystray==0.19.5",
  "pywin32==311; platform_system=='Windows'",
  "six==1.17.0",
]

[project.optional-dependencies]
build = ["pyinstaller==6.16.0"]
dev = [
  "pytest==8.4.2",
  "wheel==0.45.1",
]

[project.scripts]
3sd = "cartridge_launcher.app.main:main"

[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
